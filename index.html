<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIA PEPTIDES // Exclusive Visual Catalog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06080e;
            --card-bg: rgba(15, 20, 32, 0.75);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-purple: #b224ef;
            --accent-pink: #ff0844;
            --accent-emerald: #00f5a0;
            --accent-gold: #ffb703;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            
            --fb-profile: "https://www.facebook.com/share/19PEtnJZX6/?mibextid=wwXIfr";
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 80px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 242, 254, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 90% 50%, rgba(178, 36, 239, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(0, 245, 160, 0.1) 0%, transparent 40%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Top Announcement Bar */
        .top-notice {
            background: linear-gradient(90deg, rgba(0, 242, 254, 0.2), rgba(178, 36, 239, 0.3), rgba(0, 242, 254, 0.2));
            border-bottom: 1px solid rgba(0, 242, 254, 0.3);
            text-align: center;
            padding: 10px;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 30%, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            background: rgba(0, 242, 254, 0.15);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 20px;
            -webkit-text-fill-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .fb-btn-header {
            background: linear-gradient(135deg, #1877f2, #0052cc);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 0 25px rgba(24, 119, 242, 0.5);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fb-btn-header:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 35px rgba(24, 119, 242, 0.8);
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 40px 0 20px;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffffff 20%, #a5f3fc 60%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
        }

        .hero p {
            color: var(--text-sub);
            font-size: 1.15rem;
            max-width: 650px;
            margin: 0 auto;
        }

        /* Filter Tabs */
        .filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #000;
            border-color: transparent;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
            font-weight: 800;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        /* Card Structure */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(16px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-cyan);
            box-shadow: 0 15px 35px -10px rgba(0, 242, 254, 0.35);
        }

        /* High-Impact Visual Banner */
        .card-visual {
            height: 180px;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }

        .visual-glow {
            position: absolute;
            width: 120%;
            height: 120%;
            opacity: 0.7;
            filter: blur(30px);
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .card:hover .visual-glow {
            transform: scale(1.2);
            opacity: 0.95;
        }

        /* Custom Visual Gradients */
        .v-retatrutide { background: radial-gradient(circle, #00f2fe 0%, #4facfe 50%, #000 100%); }
        .v-bpc { background: radial-gradient(circle, #00f5a0 0%, #00d2ff 50%, #000 100%); }
        .v-semax { background: radial-gradient(circle, #b224ef 0%, #7579ff 50%, #000 100%); }
        .v-selank { background: radial-gradient(circle, #ff0844 0%, #ffb199 50%, #000 100%); }
        .v-ghk { background: radial-gradient(circle, #00c6ff 0%, #0072ff 50%, #000 100%); }
        .v-mt1 { background: radial-gradient(circle, #f857a6 0%, #ff5858 50%, #000 100%); }
        .v-cjc { background: radial-gradient(circle, #ffb703 0%, #fb8500 50%, #000 100%); }
        .v-klow { background: radial-gradient(circle, #a855f7 0%, #ec4899 50%, #000 100%); }

        .visual-symbol {
            position: relative;
            z-index: 2;
            font-size: 3.5rem;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
            transition: transform 0.3s ease;
        }

        .card:hover .visual-symbol {
            transform: scale(1.15) rotate(3deg);
        }

        .visual-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 3;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: 1px;
        }

        /* Card Content */
        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-cat {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-cyan);
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 1.45rem;
            font-weight: 800;
            margin-bottom: 4px;
            color: #fff;
        }

        .card-sub {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 14px;
        }

        .card-desc {
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.55;
            margin-bottom: 22px;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            gap: 10px;
        }

        .btn-details {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 12px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-details:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .btn-order {
            flex: 1.2;
            background: linear-gradient(135deg, #1877f2, #0052cc);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 0 20px rgba(24, 119, 242, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-order:hover {
            box-shadow: 0 0 30px rgba(24, 119, 242, 0.8);
            transform: scale(1.03);
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            background: #0d121f;
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 60px rgba(0, 242, 254, 0.3);
            border-radius: 24px;
            max-width: 580px;
            width: 100%;
            padding: 32px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 36px; height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal-cat {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 4px;
            color: #fff;
        }

        .modal-sub {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .modal-text {
            color: #cbd5e1;
            line-height: 1.65;
            font-size: 0.98rem;
            margin-bottom: 28px;
        }

        .modal-fb-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #1877f2, #0052cc);
            color: #fff;
            text-align: center;
            padding: 16px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.05rem;
            text-decoration: none;
            box-shadow: 0 0 35px rgba(24, 119, 242, 0.6);
            transition: all 0.3s ease;
        }

        .modal-fb-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 50px rgba(24, 119, 242, 0.9);
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 2.2rem; }
            header { flex-direction: column; gap: 15px; }
        }
    </style>
</head>

            },
            {
                id: 'ghkcu-100mg',
                name: 'GHK-Cu (100mg)',
                sub: 'Bakrov Tripeptid-1 High-Potency',
                category: 'lepota',
                catLabel: 'Koža & Estetika',
                glowClass: 'v-ghk',
                emoji: '✨',
                tag: '100MG MEGA DOSE',
                short: 'Zlati standard za sintezo kolagena, regeneracijo kože, zmanjšanje gub in rast las.',
                full: 'GHK-Cu (100mg) v visoki koncentraciji deluje kot močan regenerator DNK in tkiv. Spodbuja naravno proizvodnjo kolagena, elastina ter hialuronske kisline, obenem pa močno stimulira lasne mešičke za gostejše lase.'
            },
            {
                id: 'klow-80mg',
                name: 'KLOW (80mg)',
                sub: 'Ultra Complex Beauty Blend',
                category: 'lepota',
                catLabel: 'Koža & Estetika',

            {

                sub: 'Selektivni Melanin Agonist',
                category: 'lepota',

                glowClass: 'v-mt1',
                emoji: '☀️',

                short: 'Spodbuja naravno porjavitev kože z minimalno izpostavljenostjo soncu ali solariju.',
                full: 'Melanotan-1 (MT-1) spodbuja melanocite k varnejši proizvodnji temnega pigmenta (eumelanina). Omogoča hiter, naraven in dolgotrajen porjavel videz kože brez nepotrebnega tveganja za opekline.'
            }
        ];

        function render(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = items.map(p => `
                <div class="card">
                    <div class="card-visual">
                        <div class="visual-glow ${p.glowClass}"></div>
                        <div class="visual-symbol">${p.emoji}</div>
                        <span class="visual-tag">${p.tag}</span>
                    </div>
                    <div class="card-body">
                        <div class="card-cat">${p.catLabel}</div>
                        <h3 class="card-title">${p.name}</h3>
                        <div class="card-sub">${p.sub}</div>
                        <p class="card-desc">${p.short}</p>
                        <div class="card-footer">
                            <button class="btn-details" onclick="openModal('${p.id}')">Podrobno</button>
                            <a href="${FB_LINK}" target="_blank" class="btn-order">💬 Naroči na FB</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterItems(cat, e) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            if(cat === 'vse') {
                render(catalog);
            } else {
                render(catalog.filter(x => x.category === cat));
            }
        }

        function openModal(id) {
            const p = catalog.find(x => x.id === id);
            if(!p) return;

            document.getElementById('m-cat').innerText = p.catLabel;
            document.getElementById('m-title').innerText = p.name;
            document.getElementById('m-sub').innerText = p.sub;
            document.getElementById('m-text').innerText = p.full;

            document.getElementById('details-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('details-modal').classList.remove('active');
        }

        // Init
        render(catalog);
    </script>
</body>
</html>
